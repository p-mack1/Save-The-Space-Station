<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="dashboard">
        <h1>MISSION CONTROL</h1>
        <p id="briefing">Station systems are offline.</p>
        <section id="powerPanel" class="panel">
            <h2>Power Generator</h2>
            <p id="powerStatus">OFFLINE</p>
            <button id="powerBtn">Activate Power</button>
        </section>
         <section id="oxygenPanel" class="panel">
            <h2>Oxygen</h2>
            <p id="oxygenStatus">OFFLINE</p>
            <button id="oxygenBtn">Restore Oxygen</button>
        </section>
        <section id="commsPanel" class="panel">
            <h2>Communications</h2>
            <p id="commsStatus">OFFLINE</p>
            <button id="commsBtn">Contact Mission Control</button>
        </section>
        <section id="tempPanel" class="panel">
            <h2>Temperature Control</h2>
            <label for="tempInput">Set temperature (°F)</label>
            <input id="tempInput" type="number" min="50" max="100" value="75">
            <button id="tempBtn">Apply Setting</button>
            <p id="tempStatus">Current target: 75°F</p>
        </section>
        <section class="panel">
            <h2>Mission Event Log</h2>
            <ol id="eventLog"></ol>
        </section>
        <section class="panel">
            <h2>Emergency Countdown</h2>
            <p><strong id="timerText">90</strong> seconds remaining</p>
            <button id="timerBtn">Start Countdown</button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
